version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development

  client-field:
    build:
      context: ./client-field
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./client-field:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - API_URL=http://server:5000
    depends_on:
      - server

  client-dashboard:
    build:
      context: ./client-dashboard
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    volumes:
      - ./client-dashboard:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - API_URL=http://server:5000
    depends_on:
      - server
